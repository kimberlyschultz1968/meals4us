<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Meals4Us</title>
<meta name="description" content="Family dinner ideas, weekly meal-planning tips and grocery shortcuts from Meals4Us.">
<!-- No canonical tag on purpose: this one file also serves every Soro article
     (/blog/?post=slug). A fixed canonical would tell Google each article is
     really the blog home page. Soro sets each article's title, description and
     BlogPosting data itself. -->
<meta name="theme-color" content="#3A0D10">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Meals4Us">
<meta property="og:title" content="Blog — Meals4Us">
<meta property="og:description" content="Family dinner ideas, weekly meal-planning tips and grocery shortcuts.">
<meta property="og:image" content="https://meals4us.com/social-card.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* Meals4Us tokens (styles.css): warm stone ground, near-black ink, the house
     red, and the same dark-red gradient as the app header. */
  :root{ --bg:#EFECE7; --card:#FFFFFF; --ink:#1B1512; --ink-soft:#6B645C; --line:#E2DCD3;
         --red:#8C1D24; --grad:linear-gradient(135deg,#A81D26 0%,#5C0F14 55%,#171111 100%); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}
  a{color:var(--red);}
  .bar{background:var(--grad); box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .bar-in{max-width:900px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; color:#F5F1EC; text-decoration:none; font-size:22px; font-weight:600;}
  .brand img{width:40px; height:40px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.14);}
  .bar nav{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
  .bar nav a{color:rgba(245,241,236,.92); text-decoration:none; font-size:13px; font-weight:600;
             border:1px solid rgba(245,241,236,.3); border-radius:8px; padding:5px 11px;}
  .bar nav a:hover{background:rgba(255,255,255,.1);}
  main{max-width:900px; margin:22px auto 0; padding:0 16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px 26px;
        box-shadow:0 1px 2px rgba(27,21,18,.06), 0 6px 16px rgba(27,21,18,.06);}
  h1{font-size:26px; line-height:1.2; color:var(--ink);}
  .lede{color:var(--ink-soft); margin:6px 0 20px;}
  footer{max-width:900px; margin:18px auto 40px; padding:0 16px; text-align:center; font-size:13px; color:var(--ink-soft); line-height:1.7;}
  @media (max-width:560px){ .card{padding:18px 16px;} h1{font-size:22px;} .brand{font-size:20px;} .bar nav{margin-left:0;} }
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <a class="brand" href="/"><img src="/icon.svg" alt="">Meals4Us</a>
  <nav>
    <a href="/">Plan my week</a>
    <a href="/guide">Free 7-dinner plan</a>
  </nav>
</div></div>

<main>
  <div class="card">
    <h1>Blog</h1>
    <p class="lede">Dinner ideas, meal-planning tips and grocery shortcuts for busy families.</p>

    <!-- Soro blog embed — articles are published from the Soro dashboard -->
    <div id="soro-blog"></div>
    <script src="https://app.trysoro.com/api/embed/6cce0a15-445b-456e-8842-4ef5b4b8fd77" defer></script>
  </div>
</main>

<footer>
  <a href="/">Meals4Us</a> — tell us what your family likes, and we'll plan the week and write the grocery list.<br>
  <a href="/guide">Free: 7 easy family dinners</a>
</footer>

<script>
// Soro blog trial: stamp visitors as "blog" in the same meals4us_src key the app
// reads at signup (sync.js), so a signup that starts here is counted under
// "blog" in the Command Center instead of "direct". First touch wins — a visitor
// who already arrived with a source keeps it; a ?src= on a blog link is honoured.
(function () {
  var fromUrl = null, stored = null;
  try { fromUrl = new URLSearchParams(location.search).get('src'); } catch (_) {}
  try { stored = localStorage.getItem('meals4us_src'); } catch (_) {}
  var src = (fromUrl || stored || 'blog').slice(0, 60);
  if (!stored || fromUrl) { try { localStorage.setItem('meals4us_src', src); } catch (_) {} }
  var q = 'src=' + encodeURIComponent(src);
  Array.prototype.forEach.call(document.querySelectorAll('.bar a, footer a'), function (a) {
    var h = a.getAttribute('href');
    if (!h || h.indexOf('/blog') === 0) return;
    a.setAttribute('href', h + (h.indexOf('?') > -1 ? '&' : '?') + q);
  });
})();
</script>

</body>
</html>
