<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #C4232D 0%, #7A1319 45%, #201414 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 90px 70px;
    color: #FFFFFF;
  }
  .icon {
    width: 140px;
    height: 140px;
    border-radius: 32px;
    background: linear-gradient(135deg, #E63946, #1A1A1A);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 76px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    margin-bottom: 26px;
  }
  .brand {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 60px;
  }
  .brand span { color: #F2C433; }
  h1 {
    font-size: 66px;
    font-weight: 800;
    line-height: 1.14;
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .sub {
    font-size: 32px;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
    color: rgba(255,255,255,0.92);
    max-width: 780px;
    margin-bottom: 54px;
  }
  .list {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 24px;
    padding: 40px 48px;
    width: 100%;
    max-width: 820px;
  }
  .list-title {
    font-size: 26px;
    font-weight: 700;
    color: #F2C433;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 30px;
    font-weight: 600;
    padding: 13px 0;
  }
  .check {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #F2C433;
    color: #3A0D10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    flex-shrink: 0;
  }
  .cta {
    margin-top: auto;
    background: #F2C433;
    color: #3A0D10;
    font-size: 38px;
    font-weight: 800;
    padding: 26px 56px;
    border-radius: 999px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
  }
  .url {
    margin-top: 30px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
</style></head>
<body>
  <div class="icon">🍽️</div>
  <div class="brand">Meals<span>4</span>Us</div>

  <h1>Your Grocery List,<br>Already Made</h1>
  <p class="sub">Meals4Us builds the week's meals AND the shopping list — combined, organized by aisle, ready to go.</p>

  <div class="list">
    <div class="list-title">This Week's List</div>
    <div class="list-row"><span class="check">✓</span><span>Chicken breast (2 lb)</span></div>
    <div class="list-row"><span class="check">✓</span><span>Bell peppers (3)</span></div>
    <div class="list-row"><span class="check">✓</span><span>Shredded cheese</span></div>
    <div class="list-row"><span class="check">✓</span><span>Rice (1 bag)</span></div>
  </div>

  <div class="cta">Try it free for 7 days</div>
  <div class="url">meals4us.com</div>
</body></html>
